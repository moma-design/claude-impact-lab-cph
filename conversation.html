<!DOCTYPE html>
<html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Dream Job Configurator</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:#f1ece2; color:#151313; font-family:"JetBrains Mono", ui-monospace, monospace; }
  body { background-image:radial-gradient(circle, rgba(40,30,30,.22) 1px, transparent 1.3px); background-size:26px 26px; }

  .wrap { display:grid; grid-template-columns:minmax(0, 620px) 1fr; gap:40px; height:100vh; padding:28px 40px; }
  @media (max-width: 960px) { .wrap { grid-template-columns:1fr; height:auto; padding:20px 16px; } .scene { order:-1; height:38vh; } .chat { height:auto; } }

  .chat { display:flex; flex-direction:column; min-height:0; height:calc(100vh - 56px); }
  .top { display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; }
  .brand { display:inline-block; font-size:13px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; background:#151313; color:#f1ece2; padding:.5em .9em; border-radius:4px; }
  .prog { display:flex; align-items:center; gap:12px; font-size:11px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; }
  .segs { display:flex; gap:4px; }
  .segs i { width:26px; height:6px; border-radius:2px; background:rgba(21,19,19,.15); transition:background .5s; }
  .segs i.on { background:#151313; }
  .segs i.now { background:linear-gradient(90deg,#ff6fae,#ffc13a); }

  .log { flex:1; overflow-y:auto; padding:28px 4px 20px; scroll-behavior:smooth; }
  .msg { margin-bottom:26px; animation:rise .45s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes rise { from { opacity:0; transform:translateY(10px); } }
  .who { font-size:10px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; opacity:.6; margin-bottom:8px; }
  .advisor .reflect { font-size:14px; line-height:1.65; margin:0 0 12px; max-width:56ch; }
  .advisor .q { font-family:Anton, Impact, sans-serif; text-transform:uppercase; font-size:clamp(24px,2.4vw,32px); line-height:1.02; letter-spacing:.005em; }
  .you { margin-left:48px; background:#fbf8f1; border-radius:4px; padding:16px 18px; box-shadow:0 14px 30px -20px rgba(40,20,20,.5); }
  .you p { font-size:13.5px; line-height:1.65; margin:0; }
  .caret::after { content:'▍'; animation:blink 1s steps(2) infinite; margin-left:2px; }
  @keyframes blink { 50% { opacity:0; } }

  .composer { background:#fbf8f1; border-radius:4px; padding:14px; box-shadow:0 14px 30px -18px rgba(40,20,20,.45); }
  .composer label { display:block; font-size:10px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; opacity:.6; margin-bottom:8px; }
  textarea { width:100%; min-height:96px; max-height:200px; resize:vertical; border:1px solid rgba(21,19,19,.2); border-radius:4px; padding:12px; font:13.5px/1.6 "JetBrains Mono", monospace; background:#fff; color:#151313; }
  .row { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-top:10px; flex-wrap:wrap; }
  .hint { font-size:11px; opacity:.6; }
  .actions { display:flex; align-items:center; gap:16px; }
  .skip { font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:#151313; text-underline-offset:4px; }
  .send { display:inline-flex; align-items:center; gap:14px; padding:12px 18px; border:0; border-radius:4px; background:#151313; color:#ffe36a; font-family:Anton, Impact, sans-serif; font-size:20px; text-transform:uppercase; cursor:pointer; text-decoration:none; transition:transform .15s; }
  .send:hover { transform:translateY(-2px); }
  .send:disabled { opacity:.35; cursor:default; transform:none; }
  .send .arrow { font-family:"JetBrains Mono", monospace; font-size:17px; }
  .done { display:flex; justify-content:space-between; width:100%; padding:18px 22px; font-size:26px; }

  .scene { position:relative; min-height:380px; }
  .scene svg { position:absolute; inset:0; width:100%; height:100%; overflow:visible; pointer-events:none; }
  .scene .main { fill:none; stroke:rgba(30,20,20,.5); stroke-width:1.5; stroke-dasharray:6 7; }
  .scene .ripple { fill:none; stroke:rgba(30,20,20,.6); stroke-width:1; stroke-dasharray:2 6; }
  .sun { position:absolute; left:50%; top:50%; border-radius:50%; transform:translate(-50%,-50%); transition:width 1.6s cubic-bezier(.2,.8,.2,1), height 1.6s cubic-bezier(.2,.8,.2,1), filter 1.6s; animation:breathe 9s ease-in-out infinite alternate; }
  @keyframes breathe { from { scale:1; } to { scale:1.05; } }
  .youmark { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); font-family:Anton, Impact, sans-serif; font-size:clamp(34px,3.6vw,52px); }
  .tag { position:absolute; transform:translate(-50%,-50%); font-size:11px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; background:#151313; color:#f1ece2; padding:5px 10px; border-radius:3px; white-space:nowrap; z-index:3; }
  .chip { position:absolute; left:0; top:0; width:170px; padding:10px 12px; border-radius:4px; background:#fbf8f1; box-shadow:0 14px 28px -16px rgba(40,20,20,.55); font-size:10px; line-height:1.35; z-index:4;
    transition: transform 1.3s cubic-bezier(.2,.9,.25,1.1), opacity .6s; }
  .chip .k { font-size:9px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; opacity:.65; }
  .chip .t { font-family:Anton, Impact, sans-serif; text-transform:uppercase; font-size:15px; line-height:1.02; margin-top:3px; }
  .chip.y { background:#ffe500; } .chip.p { background:#ff6fae; } .chip.d { background:#151313; color:#ffe36a; }
  .caption { position:absolute; left:50%; bottom:1%; transform:translateX(-50%); font-size:11px; text-transform:uppercase; letter-spacing:.12em; text-align:center; white-space:nowrap; }
</style></head>
<body>
<div class="wrap">
  <section class="chat">
    <div class="top">
      <div class="brand">The Dream Job Configurator</div>
      <div class="prog"><span id="progLabel" aria-live="polite">Question 1 of 5</span><div class="segs" id="segs"><i></i><i></i><i></i><i></i><i></i></div></div>
    </div>
    <div class="log" id="log" aria-live="polite"></div>
    <form class="composer" id="composer">
      <label for="answer">Your answer</label>
      <textarea id="answer" placeholder="Take as much or as little space as you like."></textarea>
      <div class="row">
        <span class="hint">⌘ + Enter to send · demo: Ingrid's answer is filled in</span>
        <div class="actions"><a class="skip" id="skip" href="results.html" hidden>Skip to my results</a><button class="send" id="send" type="submit">Send <span class="arrow">→</span></button></div>
      </div>
    </form>
  </section>

  <aside class="scene" id="scene" aria-hidden="true">
    <div class="sun" id="sun"></div>
    <svg id="rings"></svg>
    <div class="youmark">YOU</div>
    <div class="caption" id="caption">Every answer lands on what's already yours.</div>
  </aside>
</div>

<script>
// Ingrid Dahl's example conversation (invented for the demo), split into reflection + question
const TURNS = [
  { reflect:'From your profile: nineteen years in hospital pharmacy, most of it on acute medicine, with medicines safety and teaching running through all of it. Let us start with what is not in there.',
    q:'What have you done that is not on LinkedIn: side projects, volunteering, things people come to you for?',
    a:"I rewrote the trust's insulin chart after we had two near misses, and it is still the one in use seven years later. I run an informal clinic for the junior doctors at four o'clock where they bring me the prescriptions they are unsure about. And I sit on the medicines safety group, but nobody outside the hospital would know any of that.",
    chips:[{c:'y', k:'Not on LinkedIn', t:'Rewrote the insulin chart'}, {c:'', k:'People come to you', t:"The 4 o'clock clinic"}] },
  { reflect:"So you redesigned the chart the whole trust still prescribes insulin on, and you run the unofficial four o'clock surgery where the doctors bring you what worries them. Is that right? Next:",
    q:'Which skills do you have that you have never listed?',
    a:'Reading the gap between the chart and the person. If a frail eighty year old comes up from A and E on four new drugs, I already know two will clash with what the GP had them on. Also saying no to a consultant without a row. And teaching, properly, at the bedside.',
    chips:[{c:'', k:'Unlisted skill', t:'Reading the gap'}, {c:'p', k:'Unlisted skill', t:'No without a row'}] },
  { reflect:'You read the gap between the chart and the life the person actually lives, you can refuse a senior colleague without it becoming a fight, and you teach at the bedside. Is that right?',
    q:'Which parts of your work give you energy, and which would you happily hand to AI tomorrow?',
    a:'Teaching gives me energy, and the honest conversations with families about stopping medicines. What I would hand over tomorrow is the reconciliation paperwork, chasing GP surgeries for lists, and the audit spreadsheets nobody reads.',
    chips:[{c:'y', k:'Gives you energy', t:'Teaching'}, {c:'d', k:'Hand to AI', t:'Paperwork & audits'}] },
  { reflect:'Teaching and the difficult family conversations are what you want more of, and the list chasing and audit spreadsheets are what you would give away. Is that right?',
    q:'What do you have to keep doing yourself to stay good at your work?',
    a:'Seeing patients. The moment I stop walking the ward I lose the thing that makes me useful, which is knowing what a person on eleven medicines actually looks like.',
    chips:[{c:'', k:'Keep doing', t:'Walking the ward'}] },
  { reflect:'You have to keep seeing patients, because the judgement that spared that man a treatment he did not need comes from being on the ward, not from the screen. Is that right? Last one:',
    q:'What matters in what comes next: freedom, stability, variety, impact, place?',
    a:'Variety and impact, in that order. I am tired of the same ward. I want to stay in the north west because my children are at school here, and the income has to be reliable. But I do not need all of it from one employer any more.',
    chips:[{c:'p', k:'What matters', t:'Variety, then impact'}, {c:'', k:'What matters', t:'North west, reliable'}] },
];

const log = document.getElementById('log'), answer = document.getElementById('answer'), send = document.getElementById('send');
let turn = 0, busy = false;

function el(tag, cls, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }
const sleep = ms => new Promise(r => setTimeout(r, ms));

async function typeInto(node, text, speed = 9) {
  node.classList.add('caret');
  for (let i = 0; i < text.length; i += 2) { node.textContent = text.slice(0, i + 2); log.scrollTop = log.scrollHeight; await sleep(speed); }
  node.classList.remove('caret');
}

async function advisorSays(t) {
  const m = el('div', 'msg advisor'); m.appendChild(el('div', 'who', 'Advisor'));
  const r = el('p', 'reflect'), q = el('div', 'q');
  m.append(r, q); log.appendChild(m);
  await typeInto(r, t.reflect, 7);
  await sleep(150);
  await typeInto(q, t.q, 14);
}

function setProgress() {
  const n = Math.min(turn + 1, 5);
  document.getElementById('progLabel').textContent = turn >= 5 ? 'All five questions answered' : `Question ${n} of 5`;
  [...document.getElementById('segs').children].forEach((s, i) => { s.className = i < turn ? 'on' : i === turn ? 'now' : ''; });
  document.getElementById('skip').hidden = !(turn >= 2 && turn < 5);
  paintSun(turn);
}

async function next() {
  setProgress();
  if (turn < 5) {
    await advisorSays(TURNS[turn]);
    answer.value = TURNS[turn].a; answer.focus();
    send.disabled = false; busy = false;
  } else {
    const m = el('div', 'msg advisor'); m.appendChild(el('div', 'who', 'Advisor'));
    const q = el('div', 'q'); m.appendChild(q); log.appendChild(m);
    await typeInto(q, 'Thank you. That is everything I needed, and there is a great deal in it.', 14);
    const c = document.getElementById('composer');
    c.innerHTML = '';
    const go = el('a', 'send done', 'See what is yours <span class="arrow">→</span>'); go.href = document.getElementById('skip').href;   // reuse a link that existed at load, so preview hosts rewrite it
    c.appendChild(go);
    document.getElementById('caption').textContent = 'Now let’s see how far it reaches.';
  }
}

document.getElementById('composer').addEventListener('submit', async e => {
  e.preventDefault();
  const text = answer.value.trim();
  if (!text || busy) return;
  busy = true; send.disabled = true;
  const m = el('div', 'msg you'); m.append(el('div', 'who', 'You'), el('p', '', '')); m.lastChild.textContent = text;
  log.appendChild(m); log.scrollTop = log.scrollHeight; answer.value = '';
  TURNS[turn].chips.forEach((c, i) => setTimeout(() => launchChip(c), 300 + i * 350));
  turn++;
  await sleep(900);
  next();
});
answer.addEventListener('keydown', e => { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) document.getElementById('composer').requestSubmit(); });

// ---- the scene: sun rises with each question, answers settle on "Already yours"
const scene = document.getElementById('scene'), sun = document.getElementById('sun');
function paintSun(step) {
  const k = Math.min(1, step / 5);
  const R = Math.min(scene.clientWidth, scene.clientHeight) * 0.5;
  const size = R * (0.62 + k * 0.78), core = 12 + k * 6;
  sun.style.width = sun.style.height = size + 'px';
  sun.style.background = `radial-gradient(circle, #f6f1e6 0%, #f6f1e6 ${core}%, ${k > .35 ? '#ffe36a' : '#e9a6c9'} ${core + 11}%, ${k > .2 ? '#ffc13a' : '#b87bd1'} ${core + 20}%, ${k > .1 ? '#ff8a4d' : '#8a63c9'} ${core + 31}%, #ff6fae ${core + 44}%, rgba(255,140,190,.25) ${core + 54}%, rgba(241,236,226,0) ${core + 60}%)`;
  sun.style.filter = `saturate(${.55 + k * .6})`;
}

const NS = 'http://www.w3.org/2000/svg', svg = document.getElementById('rings');
const NAMES = ['Already yours', 'Within reach', 'On the horizon'];
const mains = NAMES.map(() => { const c = document.createElementNS(NS, 'circle'); c.classList.add('main'); svg.appendChild(c); return c; });
const rips = Array.from({ length: 7 }, () => { const c = document.createElementNS(NS, 'circle'); c.classList.add('ripple'); svg.appendChild(c); return c; });
const tags = NAMES.map(n => { const d = el('div', 'tag', n); scene.appendChild(d); return d; });
let geo = { cx:0, cy:0, radii:[0,0,0] };

const chips = [];
const SLOTS = [-2.35, -0.8, 0.35, 2.75, 1.55, -1.6, 2.2, 0.95, -3.0];   // angles around the inner ring
function launchChip(c) {
  const d = el('div', `chip ${c.c}`, `<div class="k">${c.k}</div><div class="t">${c.t}</div>`);
  scene.appendChild(d);
  const o = { el:d, ang: SLOTS[chips.length % SLOTS.length], landed:false };
  chips.push(o);
  // start off-screen to the left, where the chat is, then fly onto the ring
  d.style.transition = 'none';
  d.style.transform = `translate(${-scene.getBoundingClientRect().left - 200}px, ${geo.cy}px) translate(-50%,-50%) rotate(-8deg)`;
  d.style.opacity = 0;
  requestAnimationFrame(() => requestAnimationFrame(() => { d.style.transition = ''; d.style.opacity = 1; o.landed = true; place(o); }));
}
function place(o) {
  const r = geo.radii[0] * 1.08;
  const x = geo.cx + Math.cos(o.ang) * r, y = geo.cy + Math.sin(o.ang) * r;
  o.el.style.transform = `translate(${x}px, ${y}px) translate(-50%,-50%)`;
}

(function tick(t) {
  const w = scene.clientWidth, h = scene.clientHeight, cx = w / 2, cy = h / 2, R = Math.min(w, h) * 0.5;
  const radii = [R * .48, R * .72, R * .96];
  if (radii[0] !== geo.radii[0]) { geo = { cx, cy, radii }; chips.filter(o => o.landed).forEach(place); }
  mains.forEach((c, i) => { c.setAttribute('cx', cx); c.setAttribute('cy', cy); c.setAttribute('r', radii[i]); });
  tags.forEach((d, i) => { const a = -Math.PI / 2 + (i - 1) * 0.55; d.style.left = cx + Math.cos(a) * radii[i] + 'px'; d.style.top = cy + Math.sin(a) * radii[i] + 'px'; });
  rips.forEach((c, k) => { const p = ((t || 0) * 0.00006 + k / rips.length) % 1; c.setAttribute('cx', cx); c.setAttribute('cy', cy); c.setAttribute('r', p * R * 1.05); c.style.opacity = Math.sin(p * Math.PI) * .5; });
  requestAnimationFrame(tick);
})();

addEventListener('resize', () => paintSun(turn));
next();
</script>
</body></html>
