<!DOCTYPE html>
<html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Dream Job Configurator</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; overflow:hidden; background:#f1ece2; color:#151313; font-family:"JetBrains Mono", ui-monospace, monospace; }
  body { background-image:radial-gradient(circle, rgba(40,30,30,.22) 1px, transparent 1.3px); background-size:26px 26px; }

  .top { position:fixed; left:0; right:0; top:0; display:flex; align-items:center; justify-content:center; gap:16px; flex-wrap:wrap; padding:24px 32px; z-index:10; }
  .brand { position:fixed; left:50%; top:58vh; transform:translate(-50%,-50%); z-index:0; white-space:nowrap; font-family:Anton, Impact, sans-serif; font-size:7.9vw; line-height:.9; text-transform:uppercase; letter-spacing:.005em; color:#151313; pointer-events:none; }
  .top::before { content:''; position:absolute; inset:0 0 -60px 0; z-index:-1; pointer-events:none; background:linear-gradient(to bottom, #f1ece2 0%, #f1ece2 62%, rgba(241,236,226,0) 100%); }
  .prog { display:flex; flex-direction:column; align-items:center; gap:10px; }
  .prog #progLabel { font-size:11px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; }
  .segs { --sw:clamp(92px,11vw,136px); position:relative; display:flex; gap:0; align-items:flex-start; }
  .segs::before { content:''; position:absolute; left:calc(var(--sw) / 2); right:calc(var(--sw) / 2); top:21px; height:3px; border-radius:3px; background:rgba(21,19,19,.12); }
  .segs .fill { position:absolute; left:calc(var(--sw) / 2); top:21px; height:3px; border-radius:3px; width:0; background:linear-gradient(90deg,#151313,#151313 70%,#ff6fae); transition:width .9s cubic-bezier(.2,.8,.2,1); }
  .step { position:relative; z-index:1; width:var(--sw); display:flex; flex-direction:column; align-items:center; gap:8px; }
  .step b { width:44px; height:44px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-family:Anton, Impact, sans-serif; font-weight:400; font-size:20px; background:rgba(255,255,255,.7); border:1.5px solid rgba(21,19,19,.2); color:rgba(21,19,19,.4); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); transition:all .5s; }
  .step span { font-size:10px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:rgba(21,19,19,.4); text-align:center; transition:color .5s; }
  .step.on b { background:#151313; border-color:#151313; color:#ffe36a; }
  .step.on span { color:#151313; }
  .step.now b { background:linear-gradient(135deg,#ff6fae,#ffc13a); border-color:transparent; color:#151313; transform:scale(1.18); box-shadow:0 0 0 6px rgba(255,111,174,.18), 0 10px 24px -10px rgba(255,111,174,.8); }
  .step.now span { color:#151313; }

  /* jobs drifting up and away */
  .sky { position:fixed; inset:0; pointer-events:none; z-index:1; overflow:hidden; }
  .job { position:absolute; left:0; top:0; width:var(--w); padding:10px 12px; border-radius:10px; font-size:10px; line-height:1.3; box-shadow:0 14px 28px -16px rgba(40,20,20,.5); will-change:transform, opacity; }
  .job .k { font-size:9px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; opacity:.65; }
  .job .t { font-family:Anton, Impact, sans-serif; text-transform:uppercase; font-size:16px; line-height:1.02; margin-top:3px; }
  .job.y { background:#ffe500; } .job.c { background:#fbf8f1; } .job.p { background:#ff6fae; } .job.d { background:#151313; color:#ffe36a; }

  /* the horizontal question flow */
  .stage { position:fixed; left:0; right:0; top:58%; transform:translateY(-50%); z-index:5; transition:opacity .8s, transform .8s; }
  .track { display:flex; align-items:center; gap:28px; transition:transform .9s cubic-bezier(.2,.8,.2,1); will-change:transform; }
  /* liquid glass: frosted body, light rim, top highlight and a soft sheen */
  .q { position:relative; flex:none; width:min(640px, 86vw); border-radius:16px; padding:28px 30px 24px; isolation:isolate;
    background:linear-gradient(150deg, rgba(255,255,255,.42), rgba(255,250,242,.16) 55%, rgba(255,255,255,.28));
    backdrop-filter:blur(22px) saturate(1.6); -webkit-backdrop-filter:blur(22px) saturate(1.6);
    border:1px solid rgba(255,255,255,.65);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.95), inset 0 -1px 0 rgba(255,255,255,.25), inset 0 0 22px rgba(255,255,255,.18), 0 24px 50px -28px rgba(40,20,20,.55);
    color:rgba(21,19,19,.3); transform:scale(.9); transition:color .7s, background .7s, transform .7s; }
  .q::before { content:''; position:absolute; inset:0; border-radius:inherit; pointer-events:none; z-index:-1;
    background:radial-gradient(120% 60% at 15% 0%, rgba(255,255,255,.55), transparent 55%), radial-gradient(80% 50% at 100% 100%, rgba(255,200,170,.18), transparent 60%); }
  .q.now { color:#151313; background:linear-gradient(150deg, rgba(255,255,255,.74), rgba(255,250,242,.55) 55%, rgba(255,255,255,.66)); transform:scale(1); }
  .q .num { display:flex; align-items:baseline; justify-content:space-between; }
  .q .num b { font-family:Anton, Impact, sans-serif; font-size:42px; font-weight:400; line-height:1; }
  .q .num span { font-size:10px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; opacity:.6; }
  .q .reflect { font-size:13px; line-height:1.6; margin:16px 0 10px; min-height:1.6em; }
  .q h2 { font-family:Anton, Impact, sans-serif; font-weight:400; text-transform:uppercase; font-size:clamp(26px,2.8vw,36px); line-height:1.02; margin:0 0 18px; }
  .q textarea { width:100%; min-height:110px; resize:vertical; border:1px solid rgba(21,19,19,.2); border-radius:10px; padding:12px; font:13.5px/1.6 "JetBrains Mono", monospace; background:rgba(255,255,255,.7); color:#151313; }
  .q .answer { font-size:13px; line-height:1.6; background:rgba(255,255,255,.6); border-radius:10px; padding:12px 14px; border-left:3px solid #151313; }
  .pills-label { font-size:10px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; opacity:.6; margin:-4px 0 10px; }
  .pills { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px; }
  .pill { font:600 12px "JetBrains Mono", monospace; padding:8px 13px; border-radius:999px; border:1px solid rgba(21,19,19,.22); background:rgba(255,255,255,.55); color:#151313; cursor:pointer;
    backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); transition:background .15s, color .15s, transform .15s, border-color .15s; }
  .pill:hover { transform:translateY(-1px); border-color:#151313; }
  .pill.on { background:#151313; color:#ffe36a; border-color:#151313; }
  .pill.on::before { content:'✓ '; }
  .pill:focus-visible { outline:2px solid #ff6fae; outline-offset:2px; }
  .pills.picked { margin:0 0 10px; }
  .pill.add { border-style:dashed; background:transparent; box-shadow:none; }
  .pill-input { font:600 12px "JetBrains Mono", monospace; padding:8px 13px; border:2px solid #151313; background:#fff; color:#151313; min-width:190px; outline:none; box-shadow:3px 3px 0 #ffe500; }
  .send:disabled { opacity:.35; cursor:default; transform:none; box-shadow:none; }
  .q .pills-label { margin-top:6px; }
  .pills.picked .pill { cursor:default; padding:6px 11px; font-size:11px; }
  .row { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-top:12px; flex-wrap:wrap; }
  .hint { font-size:11px; opacity:.6; }
  .actions { display:flex; align-items:center; gap:16px; }
  .skip { font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:#151313; text-underline-offset:4px; }
  .send { display:inline-flex; align-items:center; gap:14px; padding:12px 18px; border:0; border-radius:10px; background:#151313; color:#ffe36a; font-family:Anton, Impact, sans-serif; font-size:20px; text-transform:uppercase; cursor:pointer; text-decoration:none; transition:transform .15s; }
  .send:hover { transform:translateY(-2px); }
  .send .arrow { font-family:"JetBrains Mono", monospace; font-size:17px; }
  .caret::after { content:'▍'; animation:blink 1s steps(2) infinite; margin-left:2px; }
  @keyframes blink { 50% { opacity:0; } }

  .finale { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:22px; z-index:6; opacity:0; pointer-events:none; transition:opacity 1s .4s; }
  .finale.on { opacity:1; pointer-events:auto; }
  .finale h1 { font-family:Anton, Impact, sans-serif; font-weight:400; text-transform:uppercase; font-size:clamp(48px,7vw,104px); line-height:.92; margin:0; }
  .finale p { font-size:13px; text-transform:uppercase; letter-spacing:.06em; margin:0; }
  .finale .send { font-size:28px; padding:18px 26px; }

  /* ---- hard: square corners, thick ink outlines, offset shadows, no glass ---- */
  .q { border-radius:0; border:2.5px solid #151313; backdrop-filter:none; -webkit-backdrop-filter:none; box-shadow:8px 8px 0 #151313; }
  .q.now { background:#fbf8f1; }
  .q:not(.now) { background:#ebe5d9; border-color:rgba(21,19,19,.35); box-shadow:5px 5px 0 rgba(21,19,19,.3); }
  .q::before { display:none; }
  .q textarea, .q .answer { border-radius:0; border:2px solid #151313; background:#fff; }
  .q .answer { border-left-width:6px; }
  .pill { border-radius:0; border:2px solid #151313; background:#fff; backdrop-filter:none; -webkit-backdrop-filter:none; box-shadow:3px 3px 0 #151313; }
  .pill:hover { transform:translate(-1px,-1px); box-shadow:4px 4px 0 #151313; }
  .pill.on { box-shadow:3px 3px 0 #ff6fae; }
  .pills.picked .pill { box-shadow:none; }
  .send { border-radius:0; box-shadow:5px 5px 0 #ff6fae; }
  .send:hover { transform:translate(-2px,-2px); box-shadow:7px 7px 0 #ff6fae; }
  .send:active { transform:translate(3px,3px); box-shadow:2px 2px 0 #ff6fae; }
  .job { border-radius:0; border:2px solid #151313; box-shadow:4px 4px 0 #151313; }
  .step b { border-radius:0; border:2.5px solid #151313; background:#fbf8f1; backdrop-filter:none; -webkit-backdrop-filter:none; }
  .step.now b { box-shadow:4px 4px 0 #151313; }
  .segs::before, .segs .fill { border-radius:0; height:4px; }
</style></head>
<body>
<div class="brand" aria-hidden="true">The Dream Job Configurator</div>
<div class="top">
  <div class="prog"><span id="progLabel" aria-live="polite">Question 1 of 5</span><div class="segs" id="segs"><i class="fill" id="fill"></i></div></div>
</div>

<div class="sky" id="sky" aria-hidden="true"></div>

<div class="stage" id="stage"><div class="track" id="track"></div></div>

<div class="finale" id="finale">
  <p>Thank you. That is everything I needed.</p>
  <h1>Your world<br>is ready.</h1>
  <a class="send" id="toResults" href="results.html">See what is yours <span class="arrow">→</span></a>
</div>

<script>
// Ingrid Dahl's example conversation (invented for the demo)
const TURNS = [
  { reflect:'From your profile: nineteen years in hospital pharmacy, most of it on acute medicine, with medicines safety and teaching running through all of it.',
    q:'What have you done that is not on LinkedIn: side projects, volunteering, things people come to you for?',
    groups:[{ label:'Tap everything that fits', kind:'Not on LinkedIn',
      tags:['Rewrote a guideline*', 'Run an informal clinic*', 'Safety committee*', 'People ask me for advice', 'Mentoring', 'Volunteering', 'Side project', 'Teaching sessions', 'Organised events', 'Wrote for a journal'] }],
    jobs:[{c:'y', k:'Maybe', t:'Medication safety lead'}] },
  { reflect:'You rewrote a guideline, you run an informal clinic and you sit on the safety committee. That is a lot nobody outside the hospital sees.',
    q:'Which skills do you have that you have never listed?',
    groups:[{ label:'Tap the skills that are yours', kind:'Your skill',
      tags:['Teaching at the bedside*', 'Spotting drug interactions*', 'Saying no to seniors*', 'Calming worried families', 'Writing guidelines', 'Medicines reconciliation', 'Mentoring juniors', 'Risk assessment', 'Explaining complex things*', 'Audit & data'] }],
    jobs:[{c:'p', k:'Maybe', t:'Clinical educator'}, {c:'d', k:'Maybe', t:'AI safety reviewer'}] },
  { reflect:'You teach, you catch what others miss, and you can say no without a row.',
    q:'Which parts of your work give you energy, and which would you happily hand to AI tomorrow?',
    groups:[
      { label:'Gives me energy', kind:'Gives you energy', tags:['Teaching*', 'Family conversations*', 'Solving puzzles', 'Ward rounds', 'Mentoring', 'Improving systems'] },
      { label:'Hand to AI tomorrow', kind:'Hand to AI', tags:['Paperwork*', 'Chasing GP lists*', 'Audit spreadsheets*', 'Stock checks', 'Rotas', 'Data entry'] }],
    jobs:[{c:'y', k:'Maybe', t:'Deprescribing specialist'}] },
  { reflect:'Teaching and the honest family conversations are what you want more of. The paperwork can go.',
    q:'What do you have to keep doing yourself to stay good at your work?',
    groups:[{ label:'Tap what you must keep', kind:'Keep doing',
      tags:['Seeing patients*', 'Ward rounds*', 'Hands-on checks', 'Teaching juniors', 'Talking to families', 'Reading new guidance', 'Peer review'] }],
    jobs:[{c:'p', k:'Maybe', t:'Clinical AI safety lead'}] },
  { reflect:'You stay good by being on the ward, not behind a screen. Last one:',
    q:'What matters in what comes next: freedom, stability, variety, impact, place?',
    groups:[{ label:'Pick what matters most', kind:'Matters to you',
      tags:['Freedom', 'Stability', 'Variety*', 'Impact*', 'Place*', 'Reliable income*', 'Part-time', 'Remote work', 'Learning', 'Working with people'] }],
    jobs:[{c:'y', k:'Maybe', t:'Portfolio: two roles'}, {c:'d', k:'Maybe', t:'Medication data steward'}] },
];

const track = document.getElementById('track'), sky = document.getElementById('sky');
const sleep = ms => new Promise(r => setTimeout(r, ms));
let turn = 0, busy = false;

// all five cards exist from the start, so the flow ahead is visible
const cards = TURNS.map((t, i) => {
  const c = document.createElement('article');
  c.className = 'q';
  c.innerHTML = `<div class="num"><b>0${i + 1}</b><span>Question ${i + 1} of 5</span></div>
    <p class="reflect"></p><h2>${t.q}</h2><div class="slot"></div>`;
  track.appendChild(c);
  return c;
});

const STEP_LABELS = ['Not on LinkedIn', 'Hidden skills', 'Energy', 'Keep doing', 'What matters'];
const steps = STEP_LABELS.map((l, i) => {
  const d = document.createElement('div'); d.className = 'step';
  d.innerHTML = `<b>${i + 1}</b><span>${l}</span>`;
  document.getElementById('segs').appendChild(d); return d;
});

function centre() {
  const card = cards[Math.min(turn, 4)];
  const x = innerWidth / 2 - (card.offsetLeft + card.offsetWidth / 2);
  track.style.transform = `translateX(${x}px)`;
}
addEventListener('resize', centre);

function setProgress() {
  document.getElementById('progLabel').textContent = turn >= 5 ? 'All five questions answered' : `Question ${turn + 1} of 5`;
  steps.forEach((s, i) => { s.className = 'step' + (i < turn ? ' on' : i === turn ? ' now' : ''); });
  const a = steps[0], z = steps[Math.min(turn, 4)];
  document.getElementById('fill').style.width = (z.offsetLeft + z.offsetWidth / 2) - (a.offsetLeft + a.offsetWidth / 2) + 'px';
  cards.forEach((c, i) => c.className = 'q' + (i < turn ? ' done' : i === turn ? ' now' : ''));
}

async function typeInto(node, text, speed = 8) {
  node.classList.add('caret');
  for (let i = 0; i < text.length; i += 2) { node.textContent = text.slice(0, i + 2); await sleep(speed); }
  node.classList.remove('caret');
}

// read from a link that existed at load, so preview hosts have rewritten it
const resultsHref = () => document.getElementById('toResults').href;

async function openCard(i) {
  setProgress(); centre();
  const card = cards[i], t = TURNS[i];
  await sleep(500);
  await typeInto(card.querySelector('.reflect'), t.reflect);
  const slot = card.querySelector('.slot');
  const tag = (label, on) => `<button type="button" class="pill${on ? ' on' : ''}" aria-pressed="${on}">${label}</button>`;
  slot.innerHTML = `<form>${t.groups.map((g, gi) => `
      <div class="pills-label">${g.label}</div>
      <div class="pills" role="group" aria-label="${g.label}" data-group="${gi}">
        ${g.tags.map(x => tag(x.replace(/\*$/, ''), x.endsWith('*'))).join('')}
        <button type="button" class="pill add">+ Add your own</button>
      </div>`).join('')}
    <div class="row"><span class="hint" id="count"></span>
    <div class="actions">${i >= 2 ? `<a class="skip" href="${resultsHref()}">Skip to my results</a>` : ''}<button class="send" type="submit">Next <span class="arrow">→</span></button></div></div></form>`;
  const form = slot.querySelector('form'), send = slot.querySelector('.send');
  const update = () => {
    const n = slot.querySelectorAll('.pill.on').length;
    slot.querySelector('#count').textContent = n ? `${n} selected` : 'Pick at least one';
    send.disabled = !n;
  };
  const wire = b => b.addEventListener('click', () => { const on = b.classList.toggle('on'); b.setAttribute('aria-pressed', on); update(); });
  slot.querySelectorAll('.pill:not(.add)').forEach(wire);
  // "+ Add your own" turns into a small field; Enter adds it as a selected tag
  slot.querySelectorAll('.pill.add').forEach(add => add.addEventListener('click', () => {
    const input = document.createElement('input');
    input.className = 'pill-input'; input.placeholder = 'Type and press Enter'; input.setAttribute('aria-label', 'Add your own');
    add.replaceWith(input); input.focus();
    input.addEventListener('keydown', e => {
      if (e.key === 'Escape') { input.replaceWith(add); return; }
      if (e.key !== 'Enter') return;
      e.preventDefault();
      const v = input.value.trim();
      if (v) { const b = document.createElement('button'); b.type = 'button'; b.className = 'pill on'; b.setAttribute('aria-pressed', 'true'); b.textContent = v; wire(b); input.before(b); }
      input.value = ''; update();
    });
    input.addEventListener('blur', () => { if (!input.value.trim()) input.replaceWith(add); });
  }));
  update();
  form.addEventListener('submit', e => {
    e.preventDefault();
    const chosen = [...slot.querySelectorAll('.pills')].map(p => ({
      kind: t.groups[+p.dataset.group].kind,
      tags: [...p.querySelectorAll('.pill.on')].map(b => b.textContent),
    }));
    submit(i, chosen);
  });
  busy = false;
}

async function submit(i, chosen) {
  const all = chosen.flatMap(g => g.tags);
  if (!all.length || busy) return;
  busy = true;
  const card = cards[i];
  card.querySelector('.slot').innerHTML = chosen.filter(g => g.tags.length).map(g =>
    `<div class="pills-label">${TURNS[i].groups.find(x => x.kind === g.kind).label}</div><div class="pills picked">${g.tags.map(x => `<span class="pill on">${x}</span>`).join('')}</div>`).join('');
  // the chosen tags and the jobs they suggest rise out of the card and drift away
  const r = card.getBoundingClientRect();
  const rising = [...TURNS[i].jobs, ...chosen.flatMap(g => g.tags.slice(0, 2).map(x => ({ c:'c', k:g.kind, t:x })))];
  rising.forEach((j, k) => setTimeout(() => release(j, r), 200 + k * 360));
  turn++;
  await sleep(1100);
  if (turn < 5) openCard(turn);
  else finish();
}

function release(j, from) {
  const el = document.createElement('div');
  el.className = `job ${j.c}`;
  el.style.setProperty('--w', 150 + Math.random() * 50 + 'px');
  el.innerHTML = `<div class="k">${j.k}</div><div class="t">${j.t}</div>`;
  sky.appendChild(el);
  const x0 = from.left + 20 + Math.random() * Math.max(40, from.width - 220);
  const y0 = from.top + from.height * (.3 + Math.random() * .4);
  const drift = (Math.random() - .5) * 260, rot = (Math.random() - .5) * 10;
  const dur = 7000 + Math.random() * 3000;
  el.animate([
    { transform: `translate(${x0}px, ${y0}px) scale(.7)`, opacity: 0 },
    { transform: `translate(${x0 + drift * .2}px, ${y0 - 90}px) scale(1) rotate(${rot * .3}deg)`, opacity: 1, offset: .12 },
    { transform: `translate(${x0 + drift * .7}px, ${y0 * .35}px) scale(.92) rotate(${rot}deg)`, opacity: .85, offset: .6 },
    { transform: `translate(${x0 + drift}px, -160px) scale(.8) rotate(${rot * 1.4}deg)`, opacity: 0 },
  ], { duration: dur, easing: 'cubic-bezier(.25,.6,.3,1)', fill: 'forwards' }).onfinish = () => el.remove();
}

function finish() {
  setProgress();
  const stage = document.getElementById('stage');
  stage.style.opacity = 0; stage.style.transform = 'translateY(-64%)';
  document.getElementById('finale').classList.add('on');
}

requestAnimationFrame(() => openCard(0));
</script>
</body></html>
